name: Bug report
description: Report a reproducible GameVault problem.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: GameVault version and build
      placeholder: e.g. 2.3.0+10 candidate 2
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 x64, version/build
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots (optional)
      description: Remove credentials, personal paths, vault files and private library/session information. Use a synthetic example where possible.
